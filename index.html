<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
}
.glass {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold shadow">
🤖 DoubtSolve AI
</div>

<!-- SUBJECTS -->
<div class="flex gap-2 p-3 justify-center flex-wrap">
<button onclick="app.setSubject('Math')" class="glass px-3 py-1 rounded">Math</button>
<button onclick="app.setSubject('Physics')" class="glass px-3 py-1 rounded">Physics</button>
<button onclick="app.setSubject('Chemistry')" class="glass px-3 py-1 rounded">Chemistry</button>
<button onclick="app.setSubject('Biology')" class="glass px-3 py-1 rounded">Biology</button>
</div>

<!-- INPUT -->
<div class="p-4">
<textarea id="questionInput"
class="w-full p-3 rounded bg-gray-900 border border-gray-700 h-28"
placeholder="Type your question..."></textarea>

<div class="flex gap-2 mt-2">

<button onclick="startVoice()" class="bg-green-500 px-3 py-1 rounded">🎤</button>

<input type="file" accept="image/*" onchange="handleImage(event)" class="hidden" id="fileInput">
<button onclick="document.getElementById('fileInput').click()"
class="bg-purple-500 px-3 py-1 rounded">📷</button>

<button onclick="app.solveQuestion()"
class="bg-blue-600 px-3 py-1 rounded w-full">Solve</button>

</div>
</div>

<!-- OUTPUT -->
<div id="output" class="p-4 text-lg"></div>

<!-- HISTORY -->
<div class="p-4">
<h2 class="font-bold mb-2">History</h2>
<div id="history"></div>
</div>

<script>

// 🔥 FIREBASE CONFIG (PUT YOUR KEYS HERE)
const firebaseConfig = {
  apiKey: "AIzaSyAvvsFFdOwgxo281j5L4u0tR5HTTfu-veU",
  authDomain: "doubtsolver-7c538.firebaseapp.com",
  projectId: "doubtsolver-7c538"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🎤 VOICE
function startVoice() {
  const recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    document.getElementById("questionInput").value =
      e.results[0][0].transcript;
  };
  recognition.start();
}

// 📷 IMAGE HANDLER
function handleImage(event) {
  const file = event.target.files[0];
  const reader = new FileReader();

  reader.onload = function () {
    solveImage(reader.result);
  };

  reader.readAsDataURL(file);
}

async function solveImage(imageBase64) {

  document.getElementById("output").innerHTML = "⏳ Solving image...";

  try {
    const res = await fetch("/api/ask-ai", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: imageBase64
      })
    });

    const data = await res.json();

    const answer = data.answer || "⚠️ Could not solve image";

    app.renderResult(answer);
    app.saveToDB("📷 Image Question", answer);

  } catch {
    app.renderResult("❌ Image solve failed");
  }
}

// 🚀 APP
const app = {

  subject: "General",

  setSubject(sub) {
    this.subject = sub;
  },

  showLoading() {
    document.getElementById("output").innerHTML = "⏳ Solving...";
  },

  renderResult(text) {
    document.getElementById("output").innerHTML = `
      <div class="glass p-4 rounded">
        ${text}
      </div>
    `;
  },

  async saveToDB(q, a) {
    try {
      await db.collection("history").add({
        question: q,
        answer: a,
        subject: this.subject,
        time: new Date()
      });
    } catch(e) {
      console.error(e);
    }
  },

  async loadHistory() {
    const snapshot = await db.collection("history")
      .orderBy("time", "desc")
      .limit(10)
      .get();

    let html = "";

    snapshot.forEach(doc => {
      const d = doc.data();
      html += `
        <div class="glass p-2 mb-2 rounded">
          <b>Q:</b> ${d.question}<br>
          <b>A:</b> ${d.answer}
        </div>
      `;
    });

    document.getElementById("history").innerHTML = html;
  },

  async solveQuestion() {

    const question = document.getElementById("questionInput").value.trim();

    if (!question) {
      alert("Enter a question");
      return;
    }

    this.showLoading();

    try {

      const res = await fetch("/api/ask-ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: `[${this.subject}] ${question}`
        })
      });

      const data = await res.json();

      const answer = data.answer || "⚠️ No response";

      this.renderResult(answer);
      this.saveToDB(question, answer);
      this.loadHistory();

    } catch (e) {
      this.renderResult("⚠️ Limited mode (no AI credits)");
    }
  }
};

// LOAD HISTORY
window.onload = () => {
  app.loadHistory();
};

</script>

</body>
</html>
