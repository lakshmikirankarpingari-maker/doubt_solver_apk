<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #0f172a;
  color: white;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold">
🤖 DoubtSolve AI
</div>

<!-- INPUT -->
<div class="p-4">
<textarea id="questionInput"
class="w-full p-3 rounded bg-gray-900 border border-gray-700 h-28"
placeholder="Enter your question..."></textarea>

<button onclick="app.solveQuestion()"
class="mt-3 w-full bg-blue-600 hover:bg-blue-700 py-2 rounded">
Solve
</button>
</div>

<!-- OUTPUT -->
<div id="output" class="p-4 text-lg"></div>

<script>

const app = {
  async solveQuestion() {

    const q = document.getElementById("questionInput").value.trim();

    if (!q) {
      alert("Enter question");
      return;
    }

    document.getElementById("output").innerText = "⏳ Solving with AI...";

    try {

      const res = await fetch("/api/ask-ai", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question: q })
      });

      const data = await res.json();

      document.getElementById("output").innerText =
        data.answer || "⚠️ No response from AI";

    } catch (err) {

      document.getElementById("output").innerText =
        "❌ Failed to connect to AI";

    }
  }
};

</script>

</body>
</html>
