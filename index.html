<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubtSolve AI</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<!-- HEADER -->
<div class="bg-blue-600 text-white text-center p-4 text-xl font-bold">
🤖 DoubtSolve AI
</div>

<!-- SUBJECTS -->
<div class="flex gap-2 p-3 justify-center flex-wrap">
<button onclick="app.setSubject('Math')" class="bg-white px-3 py-1 rounded shadow">Math</button>
<button onclick="app.setSubject('Physics')" class="bg-white px-3 py-1 rounded shadow">Physics</button>
<button onclick="app.setSubject('Chemistry')" class="bg-white px-3 py-1 rounded shadow">Chemistry</button>
<button onclick="app.setSubject('Biology')" class="bg-white px-3 py-1 rounded shadow">Biology</button>
</div>

<!-- INPUT -->
<div class="p-4">
<textarea id="questionInput" class="w-full p-3 border rounded h-28"
placeholder="Type your question..."></textarea>

<div class="flex gap-2 mt-2">
<button onclick="startVoice()" class="bg-green-500 text-white px-3 py-1 rounded">🎤 Speak</button>
<button onclick="app.solveQuestion()" class="bg-blue-600 text-white px-3 py-1 rounded w-full">Solve</button>
</div>
</div>

<!-- OUTPUT -->
<div id="output" class="p-4 text-lg"></div>

<!-- HISTORY -->
<div class="p-4">
<h2 class="font-bold mb-2">History</h2>
<div id="history"></div>
</div>

<script>

// 🎤 VOICE
function startVoice() {
  const recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    document.getElementById("questionInput").value =
      e.results[0][0].transcript;
  };
  recognition.start();
}

// 🚀 APP
const app = {

  subject: "General",

  setSubject(sub) {
    this.subject = sub;
    alert("Subject: " + sub);
  },

  showLoading() {
    document.getElementById("output").innerHTML = "⏳ Solving with AI...";
  },

  renderResult(text) {
    document.getElementById("output").innerText = text;
  },

  addHistory(q, a) {
    const old = JSON.parse(localStorage.getItem("history") || "[]");
    const updated = [{q,a}, ...old];
    localStorage.setItem("history", JSON.stringify(updated));

    document.getElementById("history").innerHTML =
      updated.map(item => `
        <div class="bg-white p-2 rounded shadow mb-2">
          <b>Q:</b> ${item.q}<br>
          <b>A:</b> ${item.a}
        </div>
      `).join("");
  },

  async solveQuestion() {

    const question = document.getElementById("questionInput").value.trim();

    if (!question) {
      alert("Enter a question");
      return;
    }

    this.showLoading();

    try {

      const res = await fetch("/api/ask-ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: `[${this.subject}] ${question}`
        })
      });

      const data = await res.json();

      if (!res.ok || !data.answer && !data.reply) {
        throw new Error("AI not responding");
      }

      const answer = data.answer||data.reply;

      this.renderResult(answer);
      this.addHistory(question, answer);

    } catch (e) {
      console.error(e);
      this.renderResult("❌ AI error. Check API key or credits.");
    }
  }
};

// LOAD HISTORY
window.onload = () => {
  const old = JSON.parse(localStorage.getItem("history") || "[]");

  document.getElementById("history").innerHTML =
    old.map(item => `
      <div class="bg-white p-2 rounded shadow mb-2">
        <b>Q:</b> ${item.q}<br>
        <b>A:</b> ${item.a}
      </div>
    `).join("");
};

</script>

</body>
</html>
